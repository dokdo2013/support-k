name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite tests (PHP 8.2)
    runs-on: ubuntu-latest
    env:
      CI_ENVIRONMENT: testing
      database.tests.hostname: 127.0.0.1
      database.tests.database: ':memory:'
      database.tests.username: ''
      database.tests.password: ''
      database.tests.DBDriver: SQLite3
      database.tests.DBPrefix: test_
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, sqlite3, pdo_sqlite, curl, zip
          tools: composer:2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        shell: bash
        run: |
          find app bootstrap packaging public tests -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Audit source tree
        run: php packaging/audit-source.php .

      - name: Run SQLite tests
        run: vendor/bin/phpunit --no-coverage

  database:
    name: ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            database: MariaDB 10.11
            image: mariadb:10.11
          - php: '8.4'
            database: MariaDB 11.4
            image: mariadb:11.4
          - php: '8.4'
            database: MySQL 8.4
            image: mysql:8.4
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: supportk_tests
          MYSQL_USER: supportk
          MYSQL_PASSWORD: ci-password
          MARIADB_ROOT_PASSWORD: root-password
          MARIADB_DATABASE: supportk_tests
          MARIADB_USER: supportk
          MARIADB_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -proot-password || mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_ENVIRONMENT: testing
      database.tests.hostname: 127.0.0.1
      database.tests.database: supportk_tests
      database.tests.username: supportk
      database.tests.password: ci-password
      database.tests.DBDriver: MySQLi
      database.tests.DBPrefix: test_
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, pdo_mysql, curl, zip
          tools: composer:2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        shell: bash
        run: |
          find app bootstrap packaging public tests -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Audit source tree
        run: php packaging/audit-source.php .

      - name: Run database tests
        run: vendor/bin/phpunit --no-coverage

  package:
    name: Build install artifact
    runs-on: ubuntu-latest
    needs: [sqlite, database]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, curl, zip
          tools: composer:2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Validate source before packaging
        run: |
          composer validate --strict
          php packaging/audit-source.php .

      - name: Build install ZIP
        run: composer package

      - name: Verify package output
        shell: bash
        run: |
          test -d dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          php packaging/verify.php dist/support-k-0.1.0-alpha.1.zip
          (cd dist && sha256sum -c support-k-0.1.0-alpha.1.zip.sha256)

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: support-k-install-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3
